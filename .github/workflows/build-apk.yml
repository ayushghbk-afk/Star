name: Auto Build APK & GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare Release Artifact
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/StreamSync-v1.0.0-debug.apk
          else
            cp app/build/outputs/apk/debug/*.apk output/StreamSync-v1.0.0-debug.apk
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamSync-APK
          path: output/StreamSync-v1.0.0-debug.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: StreamSync Release v1.0.0
          body: |
            Automated APK Build for StreamSync Application.
            
            - Includes YouTube & Facebook Style Creator Channels
            - Includes Firebase Authentication & Firestore Cloud Sync
            - Includes Synchronized Lyrics & Dynamic Equalizer
          files: output/StreamSync-v1.0.0-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
